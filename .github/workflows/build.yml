name: Build Release Package

# Triggers:
#   - push tag v*            : manual release (you must place your MSIX in input/)
#   - schedule (daily 06:00 UTC): auto-detect new Wave Link Windows release on the
#                                official release-notes page, download the MSIX from
#                                the Elgato CDN, and publish a complete package.
#   - workflow_dispatch      : same as schedule, but always builds the latest (for validation)
on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build self-contained installer (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Detect latest Wave Link & download MSIX (auto modes)
        id: check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stateFile = "wavelink-app-version.txt"
          $current = if (Test-Path $stateFile) { (Get-Content $stateFile -Raw).Trim() } else { "" }
          $event = "${{ github.event_name }}"

          if ($event -eq "push") {
            # Manual tag release: user supplies the MSIX in input/
            $ver = "${{ github.ref_name }}"
            Write-Host "Manual tag release: $ver (expecting MSIX in input/)"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_release=true"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "release_tag=$ver"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "app_version=$ver"
            exit 0
          }

          try {
            $sectionUrl = "https://help.elgato.com/hc/en-us/sections/4913442828941-Wave-Link-Release-Notes"
            Write-Host "Fetching release-notes index: $sectionUrl"
            $html = (Invoke-WebRequest -Uri $sectionUrl -UseBasicParsing -TimeoutSec 120).Content
            $arts = [regex]::Matches($html, 'href="((?:https://help\.elgato\.com)?/hc/en-us/articles/\d+-Elgato-Wave-Link-[\d-]+-Windows-Release-Notes)"')
            Write-Host "Candidate Windows article links found: $($arts.Count)"
            $best = $null; $bestVer = [version]'0.0.0'
            foreach ($a in $arts) {
              $url = $a.Groups[1].Value
              if ($url.StartsWith("/")) { $url = "https://help.elgato.com" + $url }
              if ($url -match 'Wave-Link-(\d+)-(\d+)-(\d+)-Windows') {
                $v = [version]"$($Matches[1]).$($Matches[2]).$($Matches[3])"
                if ($v -gt $bestVer) { $bestVer = $v; $best = $url }
              }
            }
            if (-not $best) { throw "No Windows release-notes article found (links=$($arts.Count))." }
            $latest = $bestVer.ToString()
            Write-Host "Latest Wave Link (Windows): $latest  ($best)"

            $artHtml = (Invoke-WebRequest -Uri $best -UseBasicParsing -TimeoutSec 120).Content
            $ms = [regex]::Match($artHtml, 'https://edge\.elgato\.com/egc/windows/ewlw/[\d.]+/Stable/Elgato\.WaveLink_[\d.]+_x64\.msix')
            if (-not $ms.Success) { throw "No x64 MSIX URL found in the release-notes article." }
            $msixUrl = $ms.Value
            Write-Host "MSIX: $msixUrl"

            # schedule only releases on a version change; dispatch always releases
            $should = if ($event -eq "schedule") { ($latest -ne $current) } else { $true }
            if (-not $should) {
              Write-Host "No update (current=$current, latest=$latest). Skipping release."
              Add-Content -Path $env:GITHUB_OUTPUT -Value "should_release=false"
              exit 0
            }

            # download into input/ (git-ignored; only travels inside the release zip)
            $dest = "input/" + [System.IO.Path]::GetFileName($msixUrl)
            Invoke-WebRequest -Uri $msixUrl -OutFile $dest -TimeoutSec 300
            Write-Host "Downloaded -> $dest"

            # persist the seen version so the next scheduled run does not re-release
            Set-Content -Path $stateFile -Value $latest -NoNewline
            Add-Content -Path $env:GITHUB_OUTPUT -Value "should_release=true"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "release_tag=wavelink-$latest"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "app_version=$latest"
          }
          catch {
            Write-Error ("Detection failed: " + $_.Exception.Message)
            exit 1
          }

      - name: Commit seen app version (auto modes)
        if: steps.check.outputs.should_release == 'true' && github.event_name != 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wavelink-app-version.txt
          $diff = git status --porcelain wavelink-app-version.txt
          if ($diff) {
            git commit -m "chore: track Wave Link app version ${{ steps.check.outputs.app_version }}"
            git push
          } else {
            Write-Host "State unchanged; nothing to commit."
          }

      - name: Publish GUI installer (self-contained, single-file, win-x64)
        if: steps.check.outputs.should_release == 'true'
        run: dotnet publish src/WaveLinkWin10Setup/WaveLinkWin10Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -o dist

      - name: Assemble complete package
        if: steps.check.outputs.should_release == 'true'
        shell: pwsh
        run: |
          Copy-Item driver  dist -Recurse -Force
          Copy-Item input   dist -Recurse -Force
          Copy-Item scripts dist -Recurse -Force

      - name: Zip package
        if: steps.check.outputs.should_release == 'true'
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath wavelink-win10-driver-complete.zip

      - name: Create GitHub Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.release_tag }}
          name: Wave Link ${{ steps.check.outputs.app_version }} (Win10 installer)
          files: wavelink-win10-driver-complete.zip
          body: |
            Automated build triggered by the official Elgato Wave Link release notes.

            Bundle contents:
            - Self-contained GUI installer exe (no .NET runtime needed)
            - Official Wave Link driver MSI
            - Wave Link ${{ steps.check.outputs.app_version }} MSIX (downloaded from the Elgato CDN at build time)
            - Helper scripts

            Note: the MSIX is Elgato proprietary software. It is fetched from the official CDN at build time and bundled into this release archive; it is not modified or re-hosted as a standalone file.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
