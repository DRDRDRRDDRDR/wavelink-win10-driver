name: Build patched installer

# Triggers:
#   - push tag v*       : build the patched self-contained installer and publish the
#                          patch bundle (installer exe + driver) to this repo's Release
#   - workflow_dispatch : build only (for validation; no release unless a tag is pushed)
# Note: the auto-detection of the latest Elgato MSIX + full-package release has moved to
# the companion repo wavelink-win10-autorelease. This repo is the patch/source repo.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build self-contained installer (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish GUI installer (self-contained, single-file, win-x64)
        run: dotnet publish src/WaveLinkWin10Setup/WaveLinkWin10Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -o dist

      - name: Assemble patch bundle
        shell: pwsh
        run: |
          Copy-Item driver dist -Recurse -Force
          Compress-Archive -Path dist\* -DestinationPath wavelink-patch-bundle.zip

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wavelink-patch-bundle.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
